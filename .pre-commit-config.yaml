# .pre-commit-config.yaml
fail_fast: true # 一旦报错立刻停止后续检查，提升速度

repos:
  # 1. 官方通用轻量门禁
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key      # 拦截私钥泄露
      - id: end-of-file-fixer     # 确保文件结尾有空行
      - id: check-merge-conflict  # 拦截 <<<<<<< HEAD 冲突残留（AI 合并时常犯）
      - id: check-case-conflict     # 拦截文件名大小写冲突 (防 Win/Mac/Linux 互坑)
      - id: check-added-large-files # 拦截超大文件
        args: [ '--maxkb=1024' ]       # 限制单文件最大 1M

  # 2. 自定义的 Java + AI OpenSpec 门禁
  - repo: local
    hooks:
      - id: java-ai-guard
        name: Local Java AI Guard
        entry: python3 openspec/validators/commit_gate.py
        language: python
        additional_dependencies: [pyyaml]  # 在 hook 隔离 venv 中安装 PyYAML
        types: [text] # 监听所有文本文件，脚本内自行过滤
        pass_filenames: false # 不把文件名作为参数传给 entry，脚本内用 git diff 获取
